name: Build PDF and deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build downloadable PDF
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu             --print-to-pdf="$GITHUB_WORKSPACE/piano_dalet_dossier_riordinato.pdf"             "file://$GITHUB_WORKSPACE/index.html"
          test -s "$GITHUB_WORKSPACE/piano_dalet_dossier_riordinato.pdf"

      - name: Keep PDF in the repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piano_dalet_dossier_riordinato.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Update downloadable PDF"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
